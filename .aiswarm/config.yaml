session_name: lineage-scraper
windows:
  - window_name: grid
    layout: tiled
    panes:
      - shell_command: "codex --dangerously-bypass-approvals-and-sandbox -m gpt-5.6-terra"
        nudge:
          title: codex heavy
          agent: codex
          monitor: true
      - shell_command: "codex --dangerously-bypass-approvals-and-sandbox -m gpt-5.6-luna -c model_reasoning_effort=low"
        nudge:
          title: codex light
          agent: codex
          monitor: true
      - shell_command: "claude --dangerously-skip-permissions"
        nudge:
          title: claude heavy
          agent: claude
          monitor: true
      - shell_command: "claude --dangerously-skip-permissions --model haiku"
        nudge:
          title: claude light
          agent: claude
          monitor: true
      - shell_command: "agy --dangerously-skip-permissions"
        nudge:
          title: antigravity
          agent: antigravity
          monitor: true
      - shell_command: "grok --always-approve -m grok-build"
        nudge:
          title: grok
          agent: grok
          monitor: true
