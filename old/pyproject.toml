[project]
name = "lineage-scraper"
version = "0.1.0"
description = "Web crawler that discovers data files with full provenance/lineage tracking"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "cottrell"}
]
keywords = ["scraping", "crawler", "lineage", "provenance", "data-discovery"]

dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "argh>=0.31",
    "aiofiles>=24.0",
    "python-magic>=0.4",
    "xxhash>=3.0",
    "hishel>=1.1.7",
    "anysqlite>=0.0.5",
    "aiolimiter>=1.2.1",
    "cloudscraper>=1.2.71",
    "curl_cffi>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
cloudscraper = ["cloudscraper>=1.2.71"]
curl_cffi = ["curl_cffi>=0.6.0"]
fetchers = ["cloudscraper>=1.2.71", "curl_cffi>=0.6.0"]
playwright = ["playwright>=1.48.0"]

[project.scripts]
lineage-scraper = "lineage_scraper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lineage_scraper"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
