[project]
name = "lineage-scraper"
version = "0.0.1"
description = "Simple single-file crawler that records all links with inferred file types"
requires-python = ">=3.11"
dependencies = [
    "argh>=0.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "httpx>=0.27",
    "cloudscraper>=1.2",
]

[project.optional-dependencies]
playwright = ["playwright>=1.48.0"]
dev = ["ruff>=0.4", "pytest>=8.0"]

[project.scripts]
lineage-scraper = "lineage_scraper:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lineage_scraper.py"]
